<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>⚔️ Arena Clash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Lilita One','Trebuchet MS',Arial,sans-serif;font-weight:900}
:root{--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b2350;color:#fff;touch-action:manipulation}
.o{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 3px 0 #000}
button{cursor:pointer;color:#fff;border:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--st)}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home,#auth{background:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 22px,transparent 22px 44px),radial-gradient(circle at 50% 25%,#3d8ae6,#1a4f99 60%,#0e2d63)}
#top{display:flex;align-items:center;gap:6px;padding:8px;background:linear-gradient(#0c2a58,#14498f);border-bottom:3px solid #000}
#lv{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(#5cb8ff,#1560c0);border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2px #000}
#xpw{position:relative;flex:1;height:22px;background:#06193a;border:2px solid #000;border-radius:11px;overflow:hidden;min-width:40px}
#xpf{height:100%;width:0;background:linear-gradient(#7cf,#2a8ae0);transition:width .4s}
#xpt{position:absolute;inset:0;text-align:center;font-size:12px;line-height:20px}
.chip{display:flex;align-items:center;gap:4px;padding:3px 10px;background:#06193a;border:2px solid #000;border-radius:14px;font-size:15px}
#co{color:#ffd24a}#tr{color:#ffe9a0}
#gear{width:40px;height:40px;flex:none;font-size:22px;background:linear-gradient(#6a7a96,#3a465e);border:3px solid #000;border-radius:10px}
#views{flex:1;min-height:0;overflow-y:auto}
.view{display:none;padding:14px 12px 24px;min-height:100%}
.view.on{display:block}
#v-battle.on{display:flex;flex-direction:column;align-items:center;gap:14px}
#scene{position:relative;width:100%;max-width:420px;aspect-ratio:1/.85;border:4px solid #000;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #0006}
.plate{position:absolute;top:10px;padding:5px 18px;font-size:19px;background:linear-gradient(#2a6fd0,#143f86);border:3px solid #000;border-radius:12px;z-index:2}
#castle{font-size:clamp(90px,28vw,130px);filter:drop-shadow(0 10px 8px #0008);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
#aSub{position:absolute;bottom:10px;font-size:20px;color:#ffe066}
#battle{width:min(80%,320px);padding:16px 0;font-size:clamp(30px,9vw,42px);letter-spacing:2px;background:linear-gradient(#ffe266,#ffb300 55%,#f08a00);border:4px solid #000;border-radius:16px;box-shadow:0 7px 0 #8a4a00,0 10px 22px #0007;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.045)}}
#battle:active{transform:translateY(5px);box-shadow:0 2px 0 #8a4a00;animation:none}
.row{display:flex;gap:8px;justify-content:center;width:100%;max-width:420px}
h3{font-size:18px;margin:8px 0;text-align:center}
.hint{font-size:12px;text-align:center;color:#bcd;margin-bottom:8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;row-gap:22px;max-width:420px;margin:0 auto}
.gc{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(#4a8be8,#1d3f86);border:3px solid #000;border-radius:12px;box-shadow:inset 0 0 0 2px var(--c,#7cf),0 4px 0 #0007;flex:1}
.gc b{font-size:clamp(26px,8vw,38px);line-height:1}
.gc span{font-size:12px;padding:0 2px;text-align:center}
.gc .el{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:radial-gradient(#e58bff,#8a1fc4);border:2px solid #000;font-style:normal;font-size:13px;text-align:center;line-height:20px}
.gc.in{box-shadow:inset 0 0 0 3px #ffd24a,0 0 14px #ffd24a}
.gc.lock{filter:grayscale(.85) brightness(.6)}
.price{position:absolute;bottom:-11px;padding:3px 12px;font-size:15px;white-space:nowrap;background:linear-gradient(#ffc933,#e07800);color:#fff;border:3px solid #000;border-radius:12px}
.price.ok{background:linear-gradient(#7f7,#2a9a3a);color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto 6px}
.slots .gc{min-width:0}
.slots .empty{aspect-ratio:3/4;flex:1;border:3px dashed #8ab;border-radius:12px;opacity:.5}
.ar{display:flex;align-items:center;gap:12px;max-width:420px;margin:0 auto 10px;padding:10px 14px;background:linear-gradient(#2a62b8,#16376f);border:3px solid #000;border-radius:14px}
.ar.cur{box-shadow:0 0 0 3px #ffd24a}.ar.lock{filter:grayscale(.8) brightness(.7)}
.ar i{font-style:normal;font-size:32px}.ar div{flex:1}.ar small{display:block;font-size:12px;color:#cde;font-weight:700}
.tag{padding:5px 10px;font-size:12px;border:2px solid #000;border-radius:9px;background:#2a9a3a}
.tag.c{background:#d49a00}.tag.l{background:#8a1a1a}
#nav{display:flex;gap:4px;padding:6px 6px calc(var(--sb) + 6px);background:linear-gradient(#14498f,#0a2552);border-top:3px solid #000}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;font-size:11px;background:#1b4f9c;border:2px solid #000;border-radius:10px;font-size:22px;transition:.15s}
.nb span{font-size:11px}
.nb.on{background:linear-gradient(#ffe266,#e69100);transform:translateY(-5px);color:#fff;box-shadow:0 4px 0 #0006}

/* ---------- GAME ---------- */
#miniDeck .gc span{display:none}#miniDeck .gc b{font-size:22px}#miniDeck .gc{min-width:0}

/* ---------- OVERLAYS ---------- */
#over,.mb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center;z-index:50;background:#000c}
#over.on,.mb.on{display:flex}
#rt{font-size:clamp(38px,12vw,64px);animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#crn{font-size:44px}#rw{font-size:20px;color:#ffe066;line-height:1.5}
#ok,#rst,#cl,.lg{padding:12px 34px;font-size:20px;background:linear-gradient(#7f7,#2a9a3a);border:3px solid #000;border-radius:14px;box-shadow:0 5px 0 #0007}
#ok{background:linear-gradient(#ffe266,#f09000);color:#3a1a00}
#ok:active,.lg:active,#cl:active,#rst:active{transform:translateY(3px)}
.md{width:min(90%,380px);padding:20px;background:linear-gradient(#2a62b8,#16376f);border:4px solid #000;border-radius:18px;display:flex;flex-direction:column;gap:14px}
.md h2{font-size:26px}
.lg{padding:10px 14px;font-size:17px;background:#3a4a66;flex:1}.lg.on{background:linear-gradient(#ffe266,#f09000);color:#3a1a00}
#rst{background:linear-gradient(#e0503a,#a01e10);font-size:16px}#cl{background:linear-gradient(#6a7a96,#3a465e);font-size:16px}
#toast{position:absolute;top:calc(var(--st) + 70px);left:50%;transform:translate(-50%,-20px);padding:10px 22px;background:linear-gradient(#4d4,#186a28);border:3px solid #000;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:15px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:linear-gradient(#f55,#a01010)}
.slots .gc span{font-size:10px}
#who{font-size:21px;text-align:center;margin-bottom:-4px}
.dtabs{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
.dt{width:46px;height:40px;font-size:19px;background:#1b4f9c;border:3px solid #000;border-radius:10px;box-shadow:0 3px 0 #0007}
.dt.on{background:linear-gradient(#ffe266,#e69100);color:#3a1a00}
input{-webkit-user-select:text;user-select:text}
#auth{align-items:center;justify-content:center}
#aBox{width:min(90%,360px);display:flex;flex-direction:column;gap:12px;padding:20px;background:linear-gradient(#2a62b8,#16376f);border:4px solid #000;border-radius:18px;box-shadow:0 8px 0 #0006}
#aBox .logo{font-size:34px;text-align:center}
#aBox input{width:100%;padding:13px;font-size:17px;border:3px solid #000;border-radius:12px;background:#fff;color:#111;font-weight:700}
.tabs{display:flex;gap:6px}
.tb{flex:1;padding:10px;font-size:16px;background:#3a4a66;border:3px solid #000;border-radius:12px}
.tb.on{background:linear-gradient(#ffe266,#f09000);color:#3a1a00}
.hide{display:none}
#aErr{min-height:20px;font-size:14px;color:#ffb0b0;text-align:center}
#aGo{padding:13px;font-size:20px;background:linear-gradient(#ffe266,#f09000);color:#3a1a00;border:3px solid #000;border-radius:14px;box-shadow:0 5px 0 #0007}
#aGuest,#lo{padding:12px 20px;font-size:17px;background:linear-gradient(#6a7a96,#3a465e);border:3px solid #000;border-radius:14px;box-shadow:0 5px 0 #0007}
#aGo:active,#aGuest:active,#lo:active,#lmStay:active,#lmGo:active{transform:translateY(3px)}
#acc{font-size:19px;text-align:center;color:#ffe066}
#lmT{font-size:16px;line-height:1.4}
#lmStay,#lmGo{padding:13px;font-size:18px;border:3px solid #000;border-radius:14px;box-shadow:0 5px 0 #0007}
#lmStay{background:linear-gradient(#7f7,#2a9a3a)}#lmGo{background:linear-gradient(#e0503a,#a01e10)}
#game{background:#0a2a5c;align-items:center}
#tm{padding:6px 12px;font-size:18px;background:linear-gradient(#1c4f9a,#0c2c5e);border:3px solid #000;border-radius:12px;white-space:nowrap}
#back{width:44px;height:40px;font-size:20px;background:linear-gradient(#3fa0ff,#1560c0);border:3px solid #000;border-radius:10px;box-shadow:0 3px 0 #0007}
#cw{width:var(--cw,100%);flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none;border:3px solid #000;border-bottom:0;border-radius:14px 14px 0 0}
#tray{width:var(--cw,100%);padding:10px 10px calc(var(--sb) + 10px);background:repeating-linear-gradient(90deg,#8d5d30 0 20px,#7f5329 20px 40px);border:4px solid #1a0f06;border-radius:0 0 16px 16px;box-shadow:inset 0 3px 0 #b27d46}
#hand{display:flex;gap:8px;justify-content:center;padding:4px 4px 12px}
#hand .gc{flex:1;min-width:0;max-width:80px;cursor:pointer;touch-action:none}
#hand .gc b{font-size:clamp(30px,10vw,46px)}
#hand .gc span{display:none}
#hand .gc .el{top:auto;bottom:-9px;left:-9px;width:28px;height:28px;line-height:24px;font-size:16px}
#hand .gc.sel{transform:translateY(-12px) scale(1.07);box-shadow:inset 0 0 0 3px #ffd24a,0 0 22px #ffd24a}
#hand .gc.off{filter:grayscale(.8) brightness(.55)}
#erow{position:relative;display:flex;align-items:center;padding-left:14px}
#drop{position:absolute;left:2px;top:50%;margin-top:-16px;z-index:3;width:28px;height:28px;background:radial-gradient(circle at 35% 35%,#f1a6ff,#9a22d0 70%);border:3px solid #000;border-radius:0 50% 50% 50%;transform:rotate(-45deg);box-shadow:0 0 10px #c050ff}
#eb{position:relative;flex:1;height:24px;background:#2a0a40;border:3px solid #000;border-radius:12px;overflow:hidden}
#ef{height:100%;width:50%;background:linear-gradient(#f7a6ff,#b030e0 60%,#7a14b0);transition:width .15s}
#eb::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#0007 calc(10% - 2px) 10%)}
#en{position:absolute;left:22px;top:0;line-height:18px;font-size:19px;z-index:2}
.lvb{position:absolute;top:4px;right:4px;font-style:normal;font-size:11px;line-height:1}
.price.up{background:linear-gradient(#7fe07f,#2a9a3a)}
/* ---------- Handy-Box: alles läuft in einem hochformatigen Rahmen ---------- */
html,body{background:#050d1c}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;flex:none;height:calc(100vh - 24px);height:calc(100dvh - 24px);max-width:calc(100vw - 24px);aspect-ratio:9/16;border-radius:46px;border:4px solid #0a1a2c;overflow:hidden;background:#0b2350;box-shadow:0 0 0 3px #1c3a5c,0 20px 60px #000c}
.screen{padding:18px 6px 12px}
#hud{position:absolute;top:20px;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:0 22px;pointer-events:none}
#hl{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#lbl{font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{pointer-events:auto}
@media (max-aspect-ratio:3/5){
  #app{width:100vw;height:100vh;height:100dvh;max-width:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
  .screen{padding:var(--st) 0 0}
  #hud{top:calc(var(--st) + 6px);padding:0 8px}
}
</style>
</head>
<body>
<div id="app">

<div id="home" class="screen">
  <div id="top">
    <div id="lv" class="o">1</div>
    <div id="xpw"><div id="xpf"></div><span id="xpt" class="o"></span></div>
    <div class="chip"><span>🏆</span><b id="tr" class="o">0</b></div>
    <div class="chip"><span>🪙</span><b id="co" class="o">0</b></div>
    <button id="gear">⚙️</button>
  </div>

  <div id="views">
    <section class="view on" id="v-battle">
      <div id="who" class="o"></div>
      <div id="scene"><div id="aName" class="plate o"></div><div id="castle">🏰</div><div id="aSub" class="o"></div></div>
      <button id="battle" class="o" data-t="battle"></button>
      <div class="row" id="miniDeck"></div>
    </section>
    <section class="view" id="v-cards"></section>
    <section class="view" id="v-shop"></section>
    <section class="view" id="v-arena"></section>
  </div>

  <nav id="nav">
    <button class="nb" data-v="shop">🛒<span class="o" data-t="shop"></span></button>
    <button class="nb" data-v="cards">🃏<span class="o" data-t="cards"></span></button>
    <button class="nb on" data-v="battle">⚔️<span class="o" data-t="battleNav"></span></button>
    <button class="nb" data-v="arena">🏟️<span class="o" data-t="arenas"></span></button>
  </nav>
</div>

<div id="game" class="screen">
  <div id="hud"><div id="hl"><div id="tm" class="o">🕐 1:30</div><div id="lbl" class="o"></div></div><button id="back">🏳️</button></div>
  <div id="cw"><canvas id="cv" width="720" height="960"></canvas></div>
  <div id="tray">
    <div id="hand"></div>
    <div id="erow"><i id="drop"></i><div id="eb"><div id="ef"></div><span id="en" class="o">5</span></div></div>
  </div>
</div>

<div id="over">
  <h2 id="rt" class="o"></h2>
  <div id="crn"></div>
  <div id="rw" class="o"></div>
  <button id="ok" data-t="cont"></button>
</div>

<div id="set" class="mb">
  <div class="md">
    <h2 class="o" data-t="settings"></h2>
    <div class="o" data-t="lang"></div>
    <div class="row"><button class="lg" data-l="de">🇩🇪 Deutsch</button><button class="lg" data-l="en">🇬🇧 English</button></div>
    <div id="acc" class="o"></div>
    <button id="rst" data-t="reset"></button>
    <button id="lo" data-t="logout"></button>
    <button id="cl" data-t="close"></button>
  </div>
</div>

<div id="auth" class="screen on">
  <div id="aBox">
    <div class="logo o">⚔️ Arena Clash</div>
    <div class="row"><button class="lg" data-l="de">🇩🇪 Deutsch</button><button class="lg" data-l="en">🇬🇧 English</button></div>
    <div class="tabs"><button id="tL" class="tb on" data-t="login"></button><button id="tR" class="tb" data-t="register"></button></div>
    <input id="uN" maxlength="16" autocapitalize="off" autocomplete="username" spellcheck="false">
    <input id="uP" type="password" autocomplete="current-password">
    <input id="uP2" type="password" class="hide" autocomplete="new-password">
    <div id="aErr" class="o"></div>
    <button id="aGo" data-t="login"></button>
    <button id="aGuest" class="o" data-t="guest"></button>
  </div>
</div>

<div id="leaveM" class="mb">
  <div class="md">
    <h2 class="o" data-t="leaveT"></h2>
    <div id="lmT" class="o"></div>
    <button id="lmStay" class="o" data-t="stay"></button>
    <button id="lmGo" class="o" data-t="leaveGo"></button>
  </div>
</div>

<div id="toast" class="o"></div>
</div>
<script src="script.js"></script>
</body>
</html>
